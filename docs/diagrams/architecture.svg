<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" role="img" aria-label="pi-presence-radar system architecture">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24292f; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; rx: 8; }
    .hl  { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 8; }
    .dev { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; rx: 8; }
    .pi  { fill: none; stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
    .ttl { font-weight: 700; font-size: 13px; }
    .sub { font-size: 11px; }
    .lbl { font-size: 11px; fill: #6e7781; }
    .note{ font-size: 11px; fill: #6e7781; font-style: italic; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- row 1: sources -->
  <rect class="dev" x="80" y="30" width="320" height="70"/>
  <text class="ttl" x="100" y="58">phones · laptops · IoT</text>
  <text class="sub" x="100" y="78">people's devices on the network</text>

  <rect class="dev" x="520" y="30" width="320" height="70"/>
  <text class="ttl" x="540" y="58">home router (AP)</text>
  <text class="sub" x="540" y="78">2.4 GHz · channel 6 · beacons every ~102 ms</text>

  <text class="note" x="460" y="95" text-anchor="middle">probe requests + beacons broadcast over the air, unencrypted headers</text>

  <!-- arrows row1 -> row2 -->
  <line x1="240" y1="100" x2="240" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="680" y1="100" x2="680" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="lbl" x="455" y="140" text-anchor="middle">2.4 GHz · 802.11 frames</text>

  <!-- row 2: sniffers -->
  <rect class="hl" x="80" y="170" width="320" height="80"/>
  <text class="ttl" x="100" y="198">NodeMCU V1 — board "a"</text>
  <text class="sub" x="100" y="218">promiscuous receiver · frames parsed at +12</text>
  <text class="sub" x="100" y="234">sessions: 15 s sniff, report, power-cycle reboot</text>

  <rect class="hl" x="520" y="170" width="320" height="80"/>
  <text class="ttl" x="540" y="198">NodeMCU V3 — board "b" (venue 2)</text>
  <text class="sub" x="540" y="218">same firmware · BOARD_ID "b" via gitignored config.h</text>
  <text class="sub" x="540" y="234">a second who's-home sense point</text>

  <!-- arrows sniffers -> mqtt -->
  <line x1="240" y1="250" x2="240" y2="330" stroke="#0969da" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="680" y1="250" x2="680" y2="330" stroke="#0969da" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="lbl" x="452" y="295" text-anchor="middle" fill="#0969da">MQTT publish · presence/sighting</text>

  <!-- row 3: pi -->
  <rect class="pi" x="50" y="330" width="820" height="120"/>
  <text class="ttl" x="70" y="352">Raspberry Pi 4B — Docker host</text>

  <rect class="box" x="70" y="370" width="320" height="60"/>
  <text class="ttl" x="90" y="396">Mosquitto — MQTT broker</text>
  <text class="sub" x="90" y="414">shared backbone · :1883</text>

  <rect class="box" x="430" y="370" width="420" height="60"/>
  <text class="ttl" x="450" y="396">presence-hub — flask + paho-mqtt</text>
  <text class="sub" x="450" y="414">subscribes, dedups in memory · :8000</text>

  <line x1="390" y1="400" x2="425" y2="400" stroke="#0969da" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="lbl" x="408" y="392" text-anchor="middle" fill="#0969da">sub</text>

  <!-- arrow hub -> dashboard -->
  <line x1="640" y1="450" x2="640" y2="500" stroke="#0969da" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="lbl" x="652" y="480" fill="#0969da">HTTP · /api/who, /api/stats</text>

  <!-- row 4 -->
  <rect class="hl" x="420" y="500" width="440" height="60"/>
  <text class="ttl" x="440" y="528">web dashboard</text>
  <text class="sub" x="440" y="546">auto-refresh every 5 s · "who's home?"</text>
</svg>